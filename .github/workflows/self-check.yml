name: self-check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  self-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python factory/test_factory.py
